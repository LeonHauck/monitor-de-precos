<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico | PriceMonitor Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            color: white;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .chart-container {
            height: 350px;
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: var(--text-dim);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .price-val {
            font-weight: 600;
            color: #10b981;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">← Dashboard</a>
            <h2 style="margin:0">Tendência de Preços</h2>
        </div>

        <div class="card">
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <!-- Dados para o Gráfico (Escondidos para evitar corrupção por formatadores de JS) -->
        <div id="chartDataContainer" style="display: none;">
            {% for entry in history %}
            <span class="history-point" data-t="{{entry.timestamp}}" data-p="{{entry.price}}"></span>
            {% endfor %}
        </div>

        <div class="card">
            <h3>Registros Recentes</h3>
            <table>
                <thead>
                    <tr>
                        <th>Data e Hora</th>
                        <th>Preço Capturado</th>
                    </tr>
                </thead>
                <tbody>
                    {% for entry in history %}
                    <tr>
                        <td>{{entry.timestamp}}</td>
                        <td class="price-val">R$ {{'%.2f'|format(entry.price)}}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('priceChart').getContext('2d');

        // Coletamos os dados dos atributos HTML (Muito mais seguro)
        const points = Array.from(document.querySelectorAll('.history-point'));
        const data = points.map(el => ({
            t: el.dataset.t,
            p: parseFloat(el.dataset.p)
        })).reverse(); // Ordenamos do mais antigo para o mais novo para o gráfico

        if (data.length > 0) {
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.t.split(' ')[1]),
                    datasets: [{
                        label: 'Preço (R$)',
                        data: data.map(d => d.p),
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 4,
                        pointBackgroundColor: '#6366f1'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }
    </script>
</body>

</html>
